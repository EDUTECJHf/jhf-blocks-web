<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuidado Pequeñuelos - Jugar online | EduTec JHF</title>
  <meta name="description" content="Jugá Cuidado Pequeñuelos desde el navegador, sin instalar nada. Programá al robot Kalvin con bloques y resolvé 110 desafíos de lógica.">
  <meta name="theme-color" content="#0f3460">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cuidado Pequeñuelos - Jugar online">
  <meta property="og:description" content="Programá al robot Kalvin con bloques. 110 desafíos de lógica, gratis y sin instalar nada.">
  <meta property="og:image" content="https://edutecjhf.github.io/jhf-blocks-web/vista-previa.jpg">
  <meta property="og:url" content="https://edutecjhf.github.io/jhf-blocks-web/cuidado-pequenuelos/">
  <meta property="og:site_name" content="EduTec JHF">
  <meta property="og:locale" content="es_AR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="app/icono.png" type="image/png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    #marco { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #f5f5f5; }
    .capa { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: #0f3460; color: #fff; z-index: 10; box-sizing: border-box; }
    .capa.visible { display: flex; }
    .capa img { width: min(70vw, 46vh, 320px); height: auto; border-radius: 16px; margin-bottom: 18px; }
    .capa h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .capa p { font-size: 1rem; margin: 0 0 18px; opacity: .9; max-width: 28em; line-height: 1.4; }
    #jugar { font: inherit; font-size: 1.3rem; font-weight: 800; color: #0b2545; background: #39ff14;
      border: 0; border-radius: 14px; padding: 14px 44px; cursor: pointer; box-shadow: 0 6px 0 #1f9e0a; }
    #jugar:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f9e0a; }
    .capa a { color: #9ad1ff; margin-top: 20px; font-size: .95rem; }
    #girar .icono { font-size: 4rem; line-height: 1; margin-bottom: 14px; animation: giro 2s ease-in-out infinite; }
    @keyframes giro { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <iframe id="marco" src="app/index.html" title="Cuidado Pequeñuelos" allow="fullscreen" allowfullscreen></iframe>

  <!-- Portada: solo en celulares y tablets (pide pantalla completa y pantalla acostada) -->
  <div class="capa" id="portada">
    <img src="app/logo.jpg" alt="Cuidado Pequeñuelos">
    <p>Se juega con el celular acostado. El progreso se guarda en este navegador.</p>
    <button type="button" id="jugar">&#9654; Jugar</button>
    <a href="../#cuidado-pequenuelos">Volver a la página de EduTec JHF</a>
  </div>

  <!-- Aviso: celular parado -->
  <div class="capa" id="girar">
    <div class="icono">&#128241;</div>
    <h1>Girá el celular</h1>
    <p>Cuidado Pequeñuelos se juega con la pantalla acostada.</p>
  </div>

  <noscript>Necesitás habilitar JavaScript para jugar.</noscript>

  <script>
    (function () {
      // El juego está pensado para una pantalla de 1280 x 650 o más.
      // Si la ventana es más chica, se achica todo el juego en proporción
      // (lo mismo que hace el programa de escritorio en las netbooks).
      var ANCHO_BASE = 1280, ALTO_BASE = 650, ESCALA_MINIMA = 0.25;
      var marco = document.getElementById('marco');
      var portada = document.getElementById('portada');
      var girar = document.getElementById('girar');
      var tactil = false;
      try { tactil = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}

      function ajustar() {
        var w = window.innerWidth, h = window.innerHeight;
        var escala = Math.min(1, w / ANCHO_BASE, h / ALTO_BASE);
        if (escala < ESCALA_MINIMA) escala = ESCALA_MINIMA;
        marco.style.width = Math.ceil(w / escala) + 'px';
        marco.style.height = Math.ceil(h / escala) + 'px';
        marco.style.transform = escala < 1 ? 'scale(' + escala + ')' : 'none';
        var parado = tactil && h > w && w < 700;
        girar.className = parado && portada.className.indexOf('visible') < 0 ? 'capa visible' : 'capa';
      }

      function empezar() {
        portada.className = 'capa';
        var raiz = document.documentElement;
        var pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
        try {
          var promesa = pedir ? pedir.call(raiz) : null;
          if (promesa && promesa.then) {
            promesa.then(function () {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function () {});
              }
            }).catch(function () {});
          }
        } catch (e) {}
        ajustar();
        try { marco.contentWindow.focus(); } catch (e) {}
      }

      if (tactil) portada.className = 'capa visible';
      document.getElementById('jugar').addEventListener('click', empezar);
      window.addEventListener('resize', ajustar);
      window.addEventListener('orientationchange', function () { setTimeout(ajustar, 250); });
      document.addEventListener('fullscreenchange', ajustar);
      ajustar();
    })();
  </script>
</body>
</html>
